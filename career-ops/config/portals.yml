# Career-Ops Job Search Portals Configuration
# Defines which portals to search, keywords, and preferences

portals:
  # === India-focused ===
  - name: "Naukri"
    url: "https://www.naukri.com"
    priority: 1
    keywords:
      - "AI Engineer"
      - "LLM Engineer"
      - "Machine Learning Engineer"
      - "Senior Data Analyst"
      - "Generative AI Developer"
    location: "India"
    remote: true

  - name: "Instahyre"
    url: "https://instahyre.com"
    priority: 1
    keywords:
      - "AI Engineer"
      - "ML Engineer"
      - "Data Analyst"
    location: "India"
    remote: true

  - name: "Cutshort"
    url: "https://cutshort.io"
    priority: 2
    keywords:
      - "AI Engineer"
      - "LLM Developer"
      - "Data Analyst"
    location: "Remote India"
    remote: true

  # === Global Remote ===
  - name: "LinkedIn"
    url: "https://linkedin.com/jobs"
    priority: 1
    keywords:
      - "AI Engineer Remote"
      - "LLM Engineer Remote"
      - "Generative AI Remote"
      - "ML Engineer Remote India"
    location: "Remote"
    remote: true

  - name: "Indeed"
    url: "https://indeed.com"
    priority: 2
    keywords:
      - "AI Engineer Remote"
      - "Machine Learning Engineer Remote"
    location: "Remote"
    remote: true

  - name: "RemoteOK"
    url: "https://remoteok.com"
    priority: 2
    keywords:
      - "ai"
      - "machine-learning"
      - "python"
    location: "Remote"
    remote: true

  - name: "Wellfound (AngelList)"
    url: "https://wellfound.com"
    priority: 2
    keywords:
      - "AI Engineer"
      - "Machine Learning"
      - "LLM"
    location: "Remote"
    remote: true

  # === Startup / YC ===
  - name: "Work at a Startup (YC)"
    url: "https://workatastartup.com"
    priority: 1
    keywords:
      - "AI Engineer"
      - "ML Engineer"
      - "Generative AI"
    location: "Remote"
    remote: true

  # === AI-Specific ===
  - name: "HuggingFace Jobs"
    url: "https://huggingface.co/jobs"
    priority: 2
    keywords:
      - "ML Engineer"
      - "AI Research"
    location: "Remote"
    remote: true

  - name: "AI-Jobs.net"
    url: "https://ai-jobs.net"
    priority: 2
    keywords:
      - "AI Engineer"
      - "LLM"
      - "NLP"
    location: "Remote"
    remote: true

  # === Healthcare/Pharma AI ===
  - name: "BioPharmGuy"
    url: "https://biopharmguy.com/jobs"
    priority: 3
    keywords:
      - "Data Analyst Pharma"
      - "AI Drug Discovery"
      - "Clinical Data"
    location: "Remote"
    remote: true

  - name: "Health eCareers"
    url: "https://healthecareers.com"
    priority: 3
    keywords:
      - "Healthcare Data Analyst"
      - "Clinical Data Manager"
    location: "Remote"
    remote: true

# Search preferences
search_config:
  max_results_per_portal: 10
  recency_days: 30
  experience_level:
    - "Mid"
    - "Senior"
  exclude_keywords:
    - "intern"
    - "internship"
    - "junior"
    - "entry level"
    - "unpaid"
  salary_minimum_inr: 2500000  # ₹25 LPA
  salary_minimum_usd: 35000

# Schedule
automation:
  cron: "30 2 * * *"  # 8:00 AM IST daily
  timezone: "Asia/Kolkata"
  notification_email: "kprsnt@live.com"
