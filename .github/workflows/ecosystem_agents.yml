name: Ecosystem Agents Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  run-agents:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic openai httpx pyyaml

      - name: Run Ecosystem Orchestrator
        run: python scripts/ecosystem_agents.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }} # For fetching repo data

      - name: Prune rotating data (bound repo growth)
        run: |
          prune_dir() {
            local dir="$1"; local keep="$2"
            [ -d "$dir" ] || return 0
            ls -1t "$dir" | tail -n +"$((keep + 1))" | while read -r f; do
              rm -f "$dir/$f"
            done
          }
          prune_dir job_data/daily 60
          prune_dir ecosystem_swarm/daily_views 60
          prune_dir ecosystem_swarm/universe/chronicles 60
          prune_dir AI_Eco_Blogs 90
          echo "Retention pruning complete."

      - name: Commit ecosystem updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AI_Eco_Blogs/ blog_inputs/ job_data/ ecosystem_swarm/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Swarm Memory, Daily Views & Telemetry" && git push)
