name: Ecosystem Agents Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ecosystem-agents
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Ecosystem Orchestrator
        run: python scripts/ecosystem_agents.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_LLM_TIMEOUT: "60.0"
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }} # For fetching repo data

      - name: Prune rotating data (bound repo growth)
        run: |
          python -c '
          import os, sys
          from pathlib import Path

          def prune_dir(directory: str, keep: int):
              p = Path(directory)
              if not p.exists():
                  return
              files = sorted([f for f in p.iterdir() if f.is_file()], key=lambda x: x.stat().st_mtime, reverse=True)
              for f in files[keep:]:
                  try:
                      f.unlink()
                  except Exception as e:
                      print(f"Failed pruning {f}: {e}")

          prune_dir("ecosystem_swarm/daily_views", 60)
          prune_dir("ecosystem_swarm/universe/chronicles", 60)
          prune_dir("AI_Eco_Blogs", 90)
          print("Retention pruning complete.")
          '
      - name: Commit ecosystem updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage generated files first (agents leave unstaged changes that block rebase)
          git add AI_Eco_Blogs/ blog_inputs/ job_data/ ecosystem_swarm/

          # Commit local changes before syncing
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Auto-update: Swarm Memory, Daily Views & Telemetry"
          fi

          # Then synchronize with the latest main
          git pull --rebase --autostash origin main

          # Push if we have commits to send
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git push
          else
            echo "No changes to commit."
          fi