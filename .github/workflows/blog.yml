name: Generate Blog Posts

on:
  push:
    paths:
      - "blog_drafts/**"
  workflow_dispatch: # Allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic google-genai pyyaml

      - name: Generate blog posts
        run: python scripts/generate_blog.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY_PAID: ${{ secrets.GEMINI_API_KEY_PAID }}

      - name: Commit generated posts
        run: |
          cd blog_data
          CHANGED=$(git diff --name-only HEAD -- . 2>/dev/null || true)
          UNTRACKED=$(git ls-files --others --exclude-standard . 2>/dev/null || true)
          ALL_FILES=$(echo -e "$CHANGED\n$UNTRACKED" | grep '\.json$' | sort -u | tr '\n' ', ' | sed 's/,$//')
          cd ..
          if [ -n "$ALL_FILES" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add blog_data/*.json
            git commit -m "🤖 Auto-generated blog: $ALL_FILES"
            git push
          else
            echo "No new or changed blog posts to commit"
          fi
