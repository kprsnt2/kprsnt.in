name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # same as the Dockerfile base image
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest ruff

      - name: Guard against escaped GitHub Actions secrets
        # The pattern must be ERE-valid: \$ \{ \{ in grep -E matches the
        # literal backslash form. The old pattern used BRE-only escapes and,
        # because it was not anchored, also matched the message on the next
        # line, so this guard could never pass.
        run: |
          SEARCH='\\\$\{\{'
          if grep -rEn -- "$SEARCH" .github/workflows/ | grep -v 'SEARCH=' ; then
            echo "::error::Escaped GitHub Actions secret syntax found - must not be escaped"
            exit 1
          fi

      - name: Lint (errors only)
        run: ruff check api scripts tests --select E9,F63,F7,F82,F

      - name: Run smoke tests
        env:
          OPENAI_API_KEY: ""
          NVIDIA_API_KEY: ""
          GROQ_API_KEY: ""
        run: pytest -q

  container:
    # Builds the exact image Cloud Run runs and boots it, so a broken
    # Dockerfile, a .dockerignore rule that drops a data dir, or an import
    # error under gunicorn fails here instead of on a live revision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t kprsnt-ci .

      - name: Boot container and smoke-test it
        run: |
          docker run -d --name app -p 8080:8080 kprsnt-ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          for path in / /blog /projects /resume /sitemap.xml /favicon.ico; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "$code $path"
            [ "$code" = "200" ] || { docker logs app; exit 1; }
          done
