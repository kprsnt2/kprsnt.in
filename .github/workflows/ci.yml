name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest ruff

      - name: Guard against escaped GitHub Actions secrets
        run: |
          if grep -rEn '\\\$\{\{' .github/workflows/; then
            echo "::error::Escaped GitHub Actions secret syntax found (\${{ ... }} must not be escaped)"
            exit 1
          fi

      - name: Lint (errors only)
        run: ruff check api scripts tests --select E9,F63,F7,F82

      - name: Run smoke tests
        env:
          OPENAI_API_KEY: ""
          NVIDIA_API_KEY: ""
          GROQ_API_KEY: ""
        run: pytest -q
