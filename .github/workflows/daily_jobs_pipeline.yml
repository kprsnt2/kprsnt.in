name: Daily Social Jobs Pipeline

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Multi-Agent Jobs Pipeline
        env:
          TAVILY_API_KEY: $\{{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: $\{{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/social_jobs_pipeline.py

      - name: Commit and push updated JSON data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add job_data/
          # Only commit and push if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated job pipeline update [skip ci]" && git push)
