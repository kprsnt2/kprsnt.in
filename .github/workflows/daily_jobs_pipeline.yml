name: Daily Social Jobs Pipeline

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Multi-Agent Jobs Pipeline
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/social_jobs_pipeline.py

      - name: Prune daily job data older than 90 days
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); from social_jobs_pipeline import prune_daily_files; prune_daily_files()"

      - name: Commit and push updated JSON data (Disabled to save Vercel storage)
        run: |
          echo "Automated commit disabled to prevent excess Vercel deployment storage."
