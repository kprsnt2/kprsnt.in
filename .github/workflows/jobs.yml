name: AI Career Agent Pipeline

on:
  # schedule:
  #   - cron: '30 2 * * *'  # Daily at 8:00 AM IST (2:30 UTC)
  workflow_dispatch: # Allow manual trigger

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai httpx

      - name: Run Career Agent Pipeline
        run: python scripts/career_pipeline.py --mode full
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit pipeline results (Disabled to save Vercel storage)
        run: |
          echo "Automated career pipeline commit disabled to prevent excess Vercel deployment storage."
