name: AI Career Agent Pipeline

on:
  # schedule:
  #   - cron: '30 2 * * *'  # Daily at 8:00 AM IST (2:30 UTC)
  workflow_dispatch: # Allow manual trigger

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai httpx

      - name: Run Career Agent Pipeline
        run: python scripts/career_pipeline.py --mode full
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit pipeline results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all job data (daily + monthly + pipeline log)
          git add job_data/

          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No new or changed job listings to commit"
          else
            TODAY=$(date +%Y-%m-%d)
            DAILY_FILE="job_data/daily/${TODAY}.json"
            JOB_COUNT=$(python3 -c "import json; d=json.load(open('${DAILY_FILE}')); print(len(d.get('jobs',[])))" 2>/dev/null || echo "0")
            TOP_MATCHES=$(python3 -c "import json; d=json.load(open('${DAILY_FILE}')); print(sum(1 for j in d.get('jobs',[]) if j.get('evaluation',{}).get('overall_score',0)>=3.5))" 2>/dev/null || echo "0")
            
            git commit -m "🤖 Career Agent Pipeline (${TODAY}): ${JOB_COUNT} jobs, ${TOP_MATCHES} top matches"
            git push
          fi
