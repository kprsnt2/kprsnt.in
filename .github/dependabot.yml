# Weekly dependency update PRs. Each one runs CI (tests + Docker build) before
# it can be merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Python 3.x upgrades are made by hand, together with CI's
      # python-version, so tests always run on the image's interpreter.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
