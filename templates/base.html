<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prashanth Kumar Kadasi - AI Systems & Discrete Optimization Engineer. Creator of mSeat and autonomous multi-agent ecosystems.">
    <title>{% block title %}Prashanth Kumar Kadasi — AI Systems & Optimization{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <!-- Fonts: Fraunces (Headings), Nunito (Body), Caveat (Handwritten accents) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,300;1,9..144,500&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Editorial Design System Stylesheet -->
    <link href="{{ url_for('static', filename='css/tamara-design.css') }}?v=4" rel="stylesheet">
    <!-- Chat Widget CSS -->
    <link href="{{ url_for('static', filename='css/chat-widget.css') }}?v=4" rel="stylesheet">

    <style>
        /* Mobile menu toggle button */
        .mobile-nav-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.3rem;
            color: var(--text);
            cursor: pointer;
            padding: 0.4rem;
        }

        @media (max-width: 900px) {
            .mobile-nav-toggle { display: block; }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 1rem;
                right: 1rem;
                background: rgba(255, 251, 246, 0.98);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(0, 0, 0, 0.08);
                border-radius: 16px;
                padding: 1.25rem 1.5rem;
                box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
                gap: 0.85rem;
                z-index: 100;
            }
            .nav-links.show { display: flex; }
            .nav-right { display: none; }
        }

        /* Subtle modern footer adjustments */
        footer {
            padding: 2rem clamp(1.25rem, 4.5vw, 6rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            margin-top: 4rem;
        }
        .footer-left {
            font-family: 'Fraunces', serif;
            font-size: 0.95rem;
            color: var(--text);
        }
        .footer-built {
            font-size: 0.8rem;
            color: var(--text-soft);
        }
        .footer-nav {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
        }
        .footer-nav a {
            font-size: 0.8rem;
            color: var(--text-mid);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-nav a:hover {
            color: var(--pink-deep);
        }
    </style>
</head>

<body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Ambient Glowing Pastel Blobs -->
    <div class="blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Editorial Navigation -->
    <nav>
        <a href="/" class="nav-name">Prashanth Kumar Kadasi</a>

        <div class="nav-links" id="navLinks">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
            <a href="/projects" class="nav-link {% if request.path.startswith('/projects') %}active{% endif %}">Projects</a>
            <a href="/#my-story" class="nav-link">My Story</a>
            <a href="/aie" class="nav-link {% if request.path.startswith('/aie') or request.path in ['/jobs', '/brand', '/pharma', '/ecosystem'] %}active{% endif %}">AI Dashboards</a>
            <a href="/blog" class="nav-link {% if request.path.startswith('/blog') %}active{% endif %}">Blog</a>
            <a href="/resume" class="nav-link {% if request.path.startswith('/resume') %}active{% endif %}">Resume</a>
            <a href="/mcp" class="nav-link {% if request.path == '/mcp' %}active{% endif %}">MCP</a>
        </div>

        <div class="nav-right">
            <button class="mobile-nav-toggle" id="navToggle" aria-label="Toggle Navigation Menu">
                <i class="fas fa-bars"></i>
            </button>
            <a href="#contact" class="nav-cta">Get in Touch</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Warm Editorial Footer -->
    <footer>
        <div class="footer-left">
            Prashanth Kumar Kadasi &copy; 2026
        </div>
        <div class="footer-nav">
            <a href="/">Home</a>
            <a href="/projects">Projects</a>
            <a href="/aie">Dashboards</a>
            <a href="/blog">Blog</a>
            <a href="/resume">Resume</a>
            <a href="/mcp">MCP Connector</a>
            <a href="https://github.com/kprsnt2" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub</a>
            <a href="https://linkedin.com/in/prashanth-kumar-kadasi-b5281765" target="_blank" rel="noopener"><i class="fab fa-linkedin"></i> LinkedIn</a>
        </div>
        <div class="footer-built">
            Built with rigor & heart · Hyderabad, India
        </div>
    </footer>

    <!-- Vercel Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>

    <!-- Navigation & Smooth Scroll Script -->
    <script>
        // Mobile menu toggle
        const toggleBtn = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        if (toggleBtn && navLinks) {
            toggleBtn.addEventListener('click', () => {
                navLinks.classList.toggle('show');
            });
        }

        // Auto close mobile menu when link is clicked
        if (navLinks) {
            navLinks.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', () => {
                    navLinks.classList.remove('show');
                });
            });
        }
    </script>

    <!-- RAG Chat Widget -->
    <script src="{{ url_for('static', filename='js/chat-widget.js') }}?v=4"></script>
</body>

</html>
