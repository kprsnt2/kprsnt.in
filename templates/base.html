<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prashanth Kumar Kadasi - Data Analyst & AI Developer Portfolio">
    <title>{% block title %}Prashanth Kumar Kadasi | Portfolio{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23667eea' rx='20' width='100' height='100'/><text x='50' y='65' font-family='Arial' font-size='45' font-weight='bold' fill='white' text-anchor='middle'>PK</text></svg>">

    <!-- Bootstrap CSS (Dark Theme) -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/darkly/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Prashanth Kadasi</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">About Me</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/skills' %}active{% endif %}"
                            href="/skills">Skills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/projects' %}active{% endif %}"
                            href="/projects">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/resume' %}active{% endif %}"
                            href="/resume">Resume</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/blog' %}active{% endif %}" href="/blog">Blog</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/plotter' %}active{% endif %}" href="/plotter"><i
                                class="fas fa-chart-line" style="margin-right: 4px;"></i>Data
                            Plotter</a>
                    </li>
                    <li class="nav-item ms-2">
                        <button class="btn btn-outline-light btn-sm theme-toggle" id="themeToggle" title="Toggle theme">
                            <i class="fas fa-moon" id="themeIcon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-4" style="border-top: 1px solid var(--border-glass); margin-top: 2rem;">
        <p style="color: var(--text-secondary); margin: 0;">
            © 2025 <span
                style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600;">Prashanth
                Kumar Kadasi</span> • Built with Google's <span
                style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600;">AntiGravity</span>
            & Claude <span
                style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600;">Opus
                4.5</span> model
        </p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Theme Toggle Script -->
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        updateIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        function updateIcon(theme) {
            themeIcon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }
    </script>

    <!-- Vercel Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>

    <!-- Vercel Speed Insights -->
    <script defer src="/_vercel/speed-insights/script.js"></script>

    <!-- Interactive Particle Network Background (all pages) -->
    <canvas id="network-canvas"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;"></canvas>
    <script>
        (function () {
            const canvas = document.getElementById('network-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            let mouse = { x: null, y: null };

            // Tuning — balanced for visual appeal
            const PARTICLE_COUNT = 60;
            const CONNECTION_DIST = 160;
            const MOUSE_RADIUS = 180;
            const BASE_SPEED = 0.35;
            let particles = [];
            let animId;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // Mouse tracking
            document.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            document.addEventListener('mouseleave', () => {
                mouse.x = null;
                mouse.y = null;
            });

            // Detect theme
            function isDark() {
                return document.documentElement.getAttribute('data-theme') !== 'light';
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    // Constant base velocity — always drifting
                    const angle = Math.random() * Math.PI * 2;
                    this.baseVx = Math.cos(angle) * BASE_SPEED;
                    this.baseVy = Math.sin(angle) * BASE_SPEED;
                    this.vx = this.baseVx;
                    this.vy = this.baseVy;
                    this.radius = Math.random() * 1.8 + 0.8;
                }
                update() {
                    // Mouse REPULSION — push particles away
                    if (mouse.x !== null && mouse.y !== null) {
                        const dx = this.x - mouse.x;
                        const dy = this.y - mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < MOUSE_RADIUS && dist > 0) {
                            const force = (1 - dist / MOUSE_RADIUS) * 2.5;
                            this.vx += (dx / dist) * force;
                            this.vy += (dy / dist) * force;
                        }
                    }

                    // Ease back to base drift velocity
                    this.vx += (this.baseVx - this.vx) * 0.02;
                    this.vy += (this.baseVy - this.vy) * 0.02;

                    this.x += this.vx;
                    this.y += this.vy;

                    // Wrap around edges with buffer
                    if (this.x < -30) this.x = w + 30;
                    if (this.x > w + 30) this.x = -30;
                    if (this.y < -30) this.y = h + 30;
                    if (this.y > h + 30) this.y = -30;
                }
                draw() {
                    const dark = isDark();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = dark
                        ? 'rgba(102, 126, 234, 0.5)'
                        : 'rgba(120, 130, 160, 0.35)';
                    ctx.fill();
                }
            }

            // Initialize particles
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }

            function drawConnections() {
                const dark = isDark();
                // Particle-to-particle connections
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONNECTION_DIST) {
                            const alpha = (1 - dist / CONNECTION_DIST) * (dark ? 0.18 : 0.12);
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = dark
                                ? `rgba(102, 126, 234, ${alpha})`
                                : `rgba(100, 110, 140, ${alpha})`;
                            ctx.lineWidth = 0.7;
                            ctx.stroke();
                        }
                    }
                }

                // Mouse-to-particle connections
                if (mouse.x !== null && mouse.y !== null) {
                    for (let i = 0; i < particles.length; i++) {
                        const dx = mouse.x - particles[i].x;
                        const dy = mouse.y - particles[i].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < MOUSE_RADIUS * 1.2) {
                            const alpha = (1 - dist / (MOUSE_RADIUS * 1.2)) * (dark ? 0.35 : 0.25);
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.strokeStyle = dark
                                ? `rgba(118, 75, 162, ${alpha})`
                                : `rgba(102, 126, 234, ${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => { p.update(); p.draw(); });
                drawConnections();
                animId = requestAnimationFrame(animate);
            }

            animate();

            // Cleanup
            window.addEventListener('beforeunload', () => cancelAnimationFrame(animId));
        })();
    </script>
</body>

</html>
