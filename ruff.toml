target-version = "py311"
line-length = 120

exclude = [
    ".git",
    ".github",
    "node_modules",
    "scratch",
    "venvkprsnt",
    "__pycache__",
]

[lint]
# Error-only checks (syntax errors, undefined/unused names) to catch real
# breakage without failing on the existing codebase's style. F was added
# after the audit L-series cleanup (unused imports/vars now fail CI).
select = ["E9", "F63", "F7", "F82", "F"]
