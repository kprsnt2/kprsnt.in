<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  /* Deliberately flat: flat fills compress into a small PNG, so the preview
     card stays lightweight for social crawlers. */
  body{width:1200px;height:630px;background:#0b0f16;color:#e8ecf5;
       font-family:"Segoe UI",Arial,sans-serif;position:relative;overflow:hidden}
  .bar{position:absolute;left:0;top:0;width:14px;height:630px;background:#6366f1}
  .wrap{position:relative;padding:66px 80px 60px 94px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .brand{font-size:26px;font-weight:700;letter-spacing:2px;color:#8f9bb3}
  .brand b{color:#6366f1;font-size:30px}
  h1{font-size:76px;line-height:1.04;font-weight:800;letter-spacing:-2.5px;max-width:1000px}
  h1 i{font-style:normal;color:#a78bfa}
  p{font-size:29px;color:#93a0b8;line-height:1.4;max-width:960px;margin-top:24px}
  .row{display:flex;gap:12px}
  .tag{font-size:21px;color:#cbd5e6;border:1px solid #2a3448;background:#131a26;border-radius:8px;padding:12px 22px}
  .tag.on{color:#34d399;border-color:#1f5a48;background:#0f2a22;font-weight:600}
</style></head>
<body>
  <div class="bar"></div>
  <div class="wrap">
    <div class="brand"><b>PK</b> &nbsp;PRASHANTH KUMAR KADASI &nbsp;/&nbsp; kprsnt.in</div>
    <div>
      <h1>Data Analyst building <i>autonomous AI systems</i></h1>
      <p>Multi-agent runtimes, LLM evaluation harnesses and reliability engineering — shipped and instrumented in public.</p>
    </div>
    <div class="row">
      <div class="tag on">SWARM ONLINE</div>
      <div class="tag">10-agent runtime</div>
      <div class="tag">MCP server</div>
      <div class="tag">RAG chatbot</div>
      <div class="tag">Hyderabad, IN</div>
    </div>
  </div>
</body></html>
